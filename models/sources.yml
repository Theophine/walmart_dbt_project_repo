sources:
  - name: dbo
    database: walmart_warehouse  
    schema: dbo  

    config:
      freshness: # changed to config in v1.9
        warn_after:
          count: 365
          period:  day
        error_after:
          count: 500
          period:  day
      loaded_at_field: updated_timestamp

    tables:
      - name: orders
      - name: customers
      - name: products
      - name: employees
      - name: order_items
      - name: stores
